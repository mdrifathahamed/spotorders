name: Build Android app

# Builds the APK on every change to android/ and publishes it as a GitHub release.
# Install link on the phone: https://github.com/<owner>/spotorders/releases/latest/download/Spotorders.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Spotorders.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Spotorders app, build ${{ github.run_number }}
          make_latest: true
          files: Spotorders.apk
          body: |
            Open this page on your Android phone and tap **Spotorders.apk** to install or update.
            Updates install over the old version and keep your local data.
            Built from commit ${{ github.sha }}.
