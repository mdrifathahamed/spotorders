name: Update dataset

# Runs right after the app uploads a new order (repository_dispatch from the phone),
# every night as a safety net, or by hand. It reads the private raw log, rebuilds
# the full dataset (kept private) and the public summaries (committed here).
on:
  repository_dispatch:
    types: [new-app-data]
  schedule:
    - cron: "17 1 * * *"   # 03:17 Helsinki winter time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out private data repo into data/private
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/spotorders-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data/private

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild dataset, ranking, figures and the app map
        run: |
          python -m pipeline.osm_places        # food places + opening hours + clusters (re-downloaded monthly)
          python -m pipeline.track             # GPS track -> stays (standing still) and moves (riding)
          python -m pipeline.build_dataset
          python -m pipeline.baseline
          python -m pipeline.figures
          python -m pipeline.app_map

      - name: Save full dataset to the private repo
        working-directory: data/private
        run: |
          git config user.name "spotorders-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild enriched dataset"
            git pull --rebase --quiet
            git push
          fi

      - name: Commit public summaries
        run: |
          git config user.name "spotorders-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sample data/reference figures
          if ! git diff --cached --quiet; then
            git commit -m "Update public dataset summaries"
            git pull --rebase --quiet
            git push
          fi
